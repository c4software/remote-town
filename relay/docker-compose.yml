# Relais Remote Town, inclus dans ~/server/docker-compose.yml (services/remote-town-relay).
# Pas de port publié : Nginx Proxy Manager le joint par son nom (remote-town-relay:8080)
# sur le réseau du projet (server_default).
services:
  remote-town-relay:
    build: .
    container_name: remote-town-relay
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=https://distance.brosseau.ovh,https://c4software.github.io
    # Durcissement : rien à écrire, aucun droit Linux, ressources plafonnées
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
